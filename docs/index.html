<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanCity Tracker — Municipal Waste Transparency &amp; Accountability</title>
<meta name="description" content="Report waste problems, track municipal action, verify results, and see how your city is performing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F8F5EE; --paper:#FFFFFF; --paper-2:#FCFAF5;
  --char:#1E1C17; --ink:#2C2A24; --muted:#756F60; --faint:#9C9686;
  --line:#EAE4D6; --line-2:#F1ECE0;
  --gold:#C6A02E; --gold-2:#E6C976; --gold-3:#F3E3AE; --gold-deep:#8F7318;
  --olive:#5B6448; --olive-soft:#7C8563;
  --green:#2E7D5B; --orange:#C07716; --red:#B23A32;
  --grad-gold:linear-gradient(135deg,#F0D98C 0%,#C6A02E 55%,#A9871C 100%);
  --shadow-sm:0 1px 2px rgba(35,30,15,.05),0 2px 8px rgba(35,30,15,.05);
  --shadow:0 10px 30px rgba(48,40,18,.09),0 2px 6px rgba(48,40,18,.05);
  --shadow-lg:0 26px 60px rgba(48,40,18,.16),0 6px 16px rgba(48,40,18,.08);
  --r-sm:12px; --r:18px; --r-lg:26px; --r-xl:34px;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--ivory);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;font-size:16px}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.12;color:var(--char);letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
img{max-width:100%;display:block}
::selection{background:var(--gold-3)}

/* ---------- layout helpers ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column}
.gap6{gap:6px}.gap10{gap:10px}.gap14{gap:14px}.gap18{gap:18px}.gap24{gap:24px}
.grid{display:grid;gap:22px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt40{margin-top:40px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.center{text-align:center}
.hidden{display:none!important}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s,background .18s;white-space:nowrap;border:1px solid transparent}
.btn:active{transform:translateY(1px) scale(.99)}
.btn-gold{background:var(--grad-gold);color:#3B2F07;box-shadow:0 6px 18px rgba(198,160,46,.32)}
.btn-gold:hover{box-shadow:0 10px 26px rgba(198,160,46,.42);transform:translateY(-1px)}
.btn-ghost{background:var(--paper);border-color:var(--line);color:var(--char)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-deep);box-shadow:var(--shadow-sm)}
.btn-dark{background:var(--char);color:#F4EFE1}
.btn-dark:hover{background:#000}
.btn-sm{padding:9px 15px;font-size:13.5px}
.btn-block{width:100%;justify-content:center}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- top nav ---------- */
.topnav{position:sticky;top:0;z-index:60;background:rgba(248,245,238,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-2)}
.topnav .inner{max-width:1240px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px;letter-spacing:-.01em;color:var(--char);font-family:var(--display)}
.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--grad-gold);display:grid;place-items:center;color:#3B2F07;font-weight:800;box-shadow:0 4px 12px rgba(198,160,46,.3);font-family:var(--sans)}
.navlinks{display:flex;gap:4px;align-items:center}
.navlinks a{padding:9px 14px;border-radius:999px;font-size:14.5px;font-weight:500;color:var(--muted);transition:.16s}
.navlinks a:hover{color:var(--char);background:rgba(198,160,46,.08)}
.navlinks a.active{color:var(--gold-deep);background:rgba(198,160,46,.13);font-weight:600}
.nav-right{display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;border:1px solid var(--line);background:var(--paper);position:relative;transition:.16s;color:var(--ink)}
.icon-btn:hover{border-color:var(--gold);color:var(--gold-deep)}
.dot-badge{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--paper)}

/* ---------- landing ---------- */
.hero{position:relative;overflow:hidden;padding:74px 0 60px}
.hero-bg{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero-bg svg{position:absolute;right:-60px;top:0;height:100%;width:auto;opacity:.9}
.particles{position:absolute;inset:0}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.5;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0);opacity:.25}50%{transform:translateY(-26px);opacity:.75}}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);background:rgba(198,160,46,.12);padding:8px 15px;border-radius:999px;border:1px solid rgba(198,160,46,.24)}
.hero h1{font-size:clamp(40px,5.1vw,66px);margin:22px 0 18px}
.hero p.lead{font-size:19px;color:var(--muted);max-width:560px;line-height:1.6}
.hero-cta{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.statband{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:64px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px 22px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;height:100%;width:4px;background:var(--grad-gold);opacity:.85}
.stat .num{font-family:var(--display);font-size:36px;font-weight:800;color:var(--char)}
.stat .lbl{font-size:13.5px;color:var(--muted);margin-top:4px;font-weight:500}
.hero-visual{position:relative;height:440px}
.hv-card{position:absolute;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:20px}
.hv-float1{top:8px;left:0;width:280px;animation:float2 7s ease-in-out infinite}
.hv-float2{bottom:20px;right:0;width:300px;animation:float2 8.5s ease-in-out infinite reverse}
@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.spark{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:12px}
.spark i{flex:1;background:var(--grad-gold);border-radius:4px 4px 0 0;opacity:.85}

/* ---------- generic card ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:26px}
.card.pad-lg{padding:34px}
.sec-head{margin-bottom:22px}
.sec-head h2{font-size:clamp(26px,3vw,36px)}
.sec-head p{color:var(--muted);margin-top:8px;font-size:16px}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep)}

/* ---------- pills / tags ---------- */
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid transparent}
.pill.gold{background:rgba(198,160,46,.13);color:var(--gold-deep);border-color:rgba(198,160,46,.3)}
.pill.green{background:rgba(46,125,91,.12);color:var(--green);border-color:rgba(46,125,91,.26)}
.pill.orange{background:rgba(192,119,22,.13);color:var(--orange);border-color:rgba(192,119,22,.28)}
.pill.red{background:rgba(178,58,50,.12);color:var(--red);border-color:rgba(178,58,50,.26)}
.pill.olive{background:rgba(91,100,72,.12);color:var(--olive);border-color:rgba(91,100,72,.26)}
.pill.neutral{background:var(--paper-2);color:var(--muted);border-color:var(--line)}
.pill .swatch{width:9px;height:9px;border-radius:50%}

/* ---------- app shell (dashboard pages) ---------- */
.shell{display:grid;grid-template-columns:262px 1fr;min-height:calc(100vh - 65px)}
.side{background:var(--char);color:#E9E3D2;padding:24px 18px;position:sticky;top:65px;height:calc(100vh - 65px);overflow:auto}
.side .brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--display);font-weight:700;font-size:16px;padding:6px 10px 20px}
.side .mark{width:30px;height:30px;border-radius:9px;background:var(--grad-gold);display:grid;place-items:center;color:#3B2F07;font-weight:800;font-family:var(--sans)}
.side nav{display:flex;flex-direction:column;gap:3px}
.side nav a{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;font-size:14.5px;color:#B9B29C;font-weight:500;transition:.16s}
.side nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.side nav a.active{background:linear-gradient(90deg,rgba(198,160,46,.24),rgba(198,160,46,.05));color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
.side nav a .ic{width:18px;text-align:center;opacity:.9}
.side .side-foot{margin-top:22px;padding:14px;border-radius:14px;background:rgba(255,255,255,.05);font-size:12.5px;color:#B9B29C}
.main{padding:30px 34px 60px;max-width:1180px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{font-size:30px}
.page-head p{color:var(--muted);margin-top:6px;font-size:15px}

/* ---------- KPI cards ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow-sm);transition:.2s}
.kpi:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.kpi .k-lbl{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.kpi .k-val{font-family:var(--display);font-size:32px;font-weight:800;margin-top:8px;color:var(--char)}
.kpi .k-sub{font-size:12.5px;color:var(--faint);margin-top:4px}
.kpi.accent{background:linear-gradient(160deg,#FFFDF6,#FBF4E0);border-color:var(--gold-3)}

/* ---------- report cards / lists ---------- */
.report-item{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);transition:.18s;cursor:pointer}
.report-item:hover{box-shadow:var(--shadow);border-color:var(--gold-3);transform:translateY(-1px)}
.report-item .thumb{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#FBF4E0,#F1E6C8);color:var(--gold-deep);display:grid;place-items:center}
.report-item .rid{font-weight:700;font-size:15px;color:var(--char)}
.report-item .rmeta{font-size:13px;color:var(--muted);margin-top:3px}
.progress{height:6px;border-radius:6px;background:var(--line-2);overflow:hidden;margin-top:10px;max-width:220px}
.progress i{display:block;height:100%;background:var(--grad-gold);border-radius:6px;transition:width .8s cubic-bezier(.2,.7,.3,1)}

/* ---------- wizard ---------- */
.wizard-steps{display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap}
.wstep{display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:var(--paper)}
.wstep .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--line-2);color:var(--muted)}
.wstep.active{border-color:var(--gold);color:var(--gold-deep);background:rgba(198,160,46,.08)}
.wstep.active .n{background:var(--grad-gold);color:#3B2F07}
.wstep.done .n{background:var(--green);color:#fff}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.opt{border:1.5px solid var(--line);border-radius:var(--r);padding:18px 16px;background:var(--paper);text-align:left;transition:.18s;display:flex;flex-direction:column;gap:10px}
.opt:hover{border-color:var(--gold-3);box-shadow:var(--shadow-sm);transform:translateY(-2px)}
.opt.sel{border-color:var(--gold);background:linear-gradient(160deg,#FFFDF6,#FBF4E0);box-shadow:0 0 0 3px rgba(198,160,46,.14)}
.opt .em{width:46px;height:46px;border-radius:13px;background:rgba(198,160,46,.14);color:var(--gold-deep);display:grid;place-items:center}
.opt .tt{font-weight:600;font-size:14.5px}
.dropzone{border:2px dashed var(--line);border-radius:var(--r-lg);padding:44px;text-align:center;background:var(--paper-2);transition:.18s;cursor:pointer}
.dropzone:hover{border-color:var(--gold);background:linear-gradient(160deg,#FFFDF6,#FBF4E0)}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.field label{font-size:13.5px;font-weight:600;color:var(--char)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper);transition:.16s;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(198,160,46,.14)}
.hint{font-size:12.5px;color:var(--faint)}

/* ---------- timeline ---------- */
.timeline{position:relative;padding-left:34px}
.timeline::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--gold),var(--line))}
.tl-item{position:relative;padding:0 0 26px 0}
.tl-item .node{position:absolute;left:-34px;top:1px;width:24px;height:24px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.tl-item.done .node{background:var(--grad-gold);border-color:var(--gold);color:#3B2F07}
.tl-item.current .node{background:var(--char);border-color:var(--char);color:#fff;box-shadow:0 0 0 5px rgba(198,160,46,.18)}
.tl-item .tl-t{font-weight:700;font-size:15.5px;color:var(--char)}
.tl-item .tl-m{font-size:13px;color:var(--muted);margin-top:3px}
.tl-item .tl-card{margin-top:10px;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13.5px;color:var(--muted)}

/* ---------- before/after ---------- */
.ba{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);user-select:none;touch-action:none;box-shadow:var(--shadow)}
.ba .layer{position:absolute;inset:0}
.ba .after-layer{clip-path:inset(0 0 0 50%)}
.ba .handle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);cursor:ew-resize;transform:translateX(-50%)}
.ba .handle::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:var(--shadow);border:1px solid var(--line)}
.ba .tag{position:absolute;top:14px;padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(30,28,23,.72);color:#fff;backdrop-filter:blur(4px)}
.ba .tag.l{left:14px}.ba .tag.r{right:14px}

/* ---------- table ---------- */
.tablewrap{border:1px solid var(--line);border-radius:var(--r);overflow:auto;background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
th{text-align:left;padding:13px 16px;background:var(--paper-2);color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:14px 16px;border-bottom:1px solid var(--line-2);color:var(--ink)}
tr:last-child td{border-bottom:none}
tbody tr{transition:.14s;cursor:pointer}
tbody tr:hover{background:var(--paper-2)}
td .prio{font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--paper);outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(198,160,46,.14)}

/* ---------- map ---------- */
.map{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,#F1ECDD,#E7E0CC);height:440px}
.map .grid-lines{position:absolute;inset:0;opacity:.5;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px}
.map .road{position:absolute;background:rgba(255,255,255,.75);border-radius:4px}
.pin{position:absolute;width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 4px 10px rgba(0,0,0,.2);border:2px solid #fff;transition:.18s;cursor:pointer}
.pin:hover{transform:rotate(-45deg) scale(1.25);z-index:5}
.pin.gold{background:var(--gold)}.pin.orange{background:var(--orange)}.pin.green{background:var(--green)}.pin.red{background:var(--red)}
.pin .lbl{position:absolute;transform:rotate(45deg);font-size:10px}

/* ---------- charts ---------- */
.chart-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow-sm)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.legend .sw{width:10px;height:10px;border-radius:3px}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap}

/* ---------- score ring ---------- */
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;text-align:center}
.ring .val b{font-family:var(--display);font-size:44px;color:var(--char)}
.ring .val small{display:block;font-size:12.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}

/* ---------- modal / drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(28,24,12,.5);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--paper);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:32px;animation:pop .24s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--paper);box-shadow:var(--shadow-lg);z-index:210;padding:26px;overflow:auto;animation:slidein .26s cubic-bezier(.2,.8,.3,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.notif{display:flex;gap:14px;padding:16px;border-radius:14px;border:1px solid var(--line);margin-bottom:12px;background:var(--paper-2)}
.notif .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(198,160,46,.14);color:var(--gold-deep);flex:none}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--char);color:#F4EFE1;padding:14px 22px;border-radius:999px;box-shadow:var(--shadow-lg);z-index:300;font-size:14.5px;display:flex;align-items:center;gap:10px;animation:pop .24s ease}
.toast .dot{width:9px;height:9px;border-radius:50%;background:var(--gold-2)}

/* success check */
.success-ring{width:96px;height:96px;border-radius:50%;background:var(--grad-gold);display:grid;place-items:center;margin:0 auto;box-shadow:0 14px 40px rgba(198,160,46,.4);animation:pop .4s cubic-bezier(.2,.8,.3,1)}
.success-ring svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .15s forwards ease}
@keyframes draw{to{stroke-dashoffset:0}}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--line-2) 25%,#fff 50%,var(--line-2) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:8px}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- auth ---------- */
.authwrap{min-height:calc(100vh - 65px);display:grid;place-items:center;padding:40px 20px;background:radial-gradient(1000px 500px at 50% -10%,rgba(198,160,46,.13),transparent 60%)}
.authcard{max-width:440px;width:100%}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.role{border:1.5px solid var(--line);border-radius:16px;padding:16px;background:var(--paper);text-align:left;transition:.18s}
.role:hover{border-color:var(--gold-3);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.role.sel{border-color:var(--gold);background:linear-gradient(160deg,#FFFDF6,#FBF4E0);box-shadow:0 0 0 3px rgba(198,160,46,.14)}
.role .em{font-size:22px}
.role .tt{font-weight:700;font-size:14px;margin-top:6px}
.role .dd{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- footer ---------- */
.foot{border-top:1px solid var(--line);margin-top:70px;padding:40px 0 60px;color:var(--muted);font-size:14px}
.foot .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}
.foot h5{font-family:var(--sans);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--char);margin-bottom:12px}
.foot a{display:block;padding:5px 0;color:var(--muted);transition:.15s}
.foot a:hover{color:var(--gold-deep)}
.disclaimer{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;font-size:13.5px;color:var(--muted);margin-top:30px;display:flex;gap:14px;align-items:flex-start}
.disclaimer .ic{flex:none;font-size:18px}

/* ---------- responsive ---------- */
@media(max-width:1080px){
  .hero .wrap{grid-template-columns:1fr}
  .hero-visual{display:none}
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .statband{grid-template-columns:repeat(2,1fr)}
  .foot .cols{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  .navlinks{display:none}
  .wrap{padding:0 18px}
  .main{padding:22px 18px 100px}
  .statband{grid-template-columns:1fr 1fr}
  .role-pick{grid-template-columns:1fr}
  .bottomnav{display:flex!important}
}
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:70;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:6px;border-radius:12px;font-weight:600}
.bottomnav a.active{color:var(--gold-deep)}
.bottomnav a .ic{font-size:19px}
</style>

<script>
/* ============ CleanCity Tracker — live API client (with graceful demo fallback) ============
   When the FastAPI backend is running, the SPA talks to it. When it is not
   (e.g. the file is opened directly), the app falls back to embedded demo data
   so the UI still works — but every write action requires the live API.
*/
const API_BASE = (() => {
  const q = new URLSearchParams(location.search).get('api');
  if (q) return q.replace(/\/$/, '');
  if (location.protocol === 'file:') return 'http://localhost:8000';
  if (location.hostname.endsWith('github.io')) return 'https://cleancity-tracker.onrender.com';
  return ''; // same origin when served by the backend
})();

const api = {
  token: localStorage.getItem('cct_token') || null,
  online: false,
  setToken(t) { this.token = t; if (t) localStorage.setItem('cct_token', t); else localStorage.removeItem('cct_token'); },
  headers(extra) { const h = Object.assign({}, extra || {}); if (this.token) h['Authorization'] = 'Bearer ' + this.token; return h; },
  async call(path, opts = {}) {
    const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers: this.headers(opts.headers) }));
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok) { const msg = (data && (data.detail || data.message)) || ('Request failed (' + res.status + ')'); const err = new Error(msg); err.status = res.status; throw err; }
    return data;
  },
  // ---- auth ----
  login(email, password) { return this.call('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) }); },
  register(name, email, password, ward) { return this.call('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, password, ward }) }); },
  me() { return this.call('/api/auth/me'); },
  // ---- reports ----
  listReports() { return this.call('/api/reports'); },
  getReport(id) { return this.call('/api/reports/' + encodeURIComponent(id)); },
  createReport(payload) { return this.call('/api/reports', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); },
  setStatus(id, status, note) { return this.call('/api/reports/' + encodeURIComponent(id) + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status, note }) }); },
  assign(id, team_id, deadline) { return this.call('/api/reports/' + encodeURIComponent(id) + '/assign', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ team_id, deadline }) }); },
  verify(id, result, note) { return this.call('/api/reports/' + encodeURIComponent(id) + '/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ result, note }) }); },
  async uploadEvidence(id, kind, file) {
    const fd = new FormData(); fd.append('kind', kind); fd.append('file', file);
    return this.call('/api/reports/' + encodeURIComponent(id) + '/evidence', { method: 'POST', body: fd });
  },
  // ---- data ----
  cityStats() { return this.call('/api/stats/city'); },
  officerStats() { return this.call('/api/stats/officer'); },
  notifications() { return this.call('/api/notifications'); },
  readNotif(id) { return this.call('/api/notifications/' + id + '/read', { method: 'POST' }); },
  teams() { return this.call('/api/teams'); },
  users() { return this.call('/api/users'); },
  setRole(id, role) { return this.call('/api/users/' + id + '/role', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role }) }); },
  audit() { return this.call('/api/audit'); },
  uploadUrl(filename) { return API_BASE + '/api/uploads/' + encodeURIComponent(filename) + '?token=' + encodeURIComponent(this.token || ''); }
};

/* map an API report into the shape the views already expect */
function mapReport(r) {
  const t = ISSUE_TYPES.find(x => x.t === r.issue_type) || { k: 'other' };
  return {
    id: r.id, issue: r.issue_type, icon: ISSUE_IC[t.k], loc: r.location, ward: r.ward,
    status: r.status, prio: r.priority, date: (r.created_at || '').slice(0, 10),
    progress: r.progress, team: r.team || '—', dept: r.dept || '—',
    events: r.events || null, evidence: r.evidence || null, verification: r.verification || null
  };
}

/* ================= charts (inline SVG, no libraries) ================= */
function areaChart(data,{w=560,h=180,color='#C6A02E',fill='rgba(198,160,46,.16)'}={}){
  const max=Math.max(...data)*1.15, min=0;
  const step=(w-10)/(data.length-1);
  const pts=data.map((v,i)=>[5+i*step, h-8-((v-min)/(max-min))*(h-24)]);
  const line=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area=`${line} L ${pts[pts.length-1][0].toFixed(1)} ${h-8} L ${pts[0][0].toFixed(1)} ${h-8} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="height:${h}px">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6A02E" stop-opacity=".28"/><stop offset="1" stop-color="#C6A02E" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ag)"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.filter((_,i)=>i%Math.ceil(data.length/7)===0).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#fff" stroke="${color}" stroke-width="2"/>`).join('')}
  </svg>`;
}
function barChart(data,labels,{w=560,h=200,color='#C6A02E'}={}){
  const max=Math.max(...data)*1.12, n=data.length, bw=(w-20)/n*0.62, gap=(w-20)/n;
  const bars=data.map((v,i)=>{
    const bh=(v/max)*(h-30), x=10+i*gap+(gap-bw)/2, y=h-22-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="5" fill="url(#bg2)"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="11" fill="#9C9686" font-family="Inter">${labels[i]}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="height:${h}px">
    <defs><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6C976"/><stop offset="1" stop-color="#C6A02E"/></linearGradient></defs>
    ${bars}</svg>`;
}
function donut(parts,{size=170,stroke=22}={}){
  const total=parts.reduce((a,p)=>a+p.v,0)||1; const r=(size-stroke)/2, c=2*Math.PI*r;
  let off=0; const segs=parts.map(p=>{
    const len=p.v/total*c; const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="${stroke}" stroke-dasharray="${len.toFixed(1)} ${(c-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>`; off+=len; return s;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#F1ECE0" stroke-width="${stroke}"/>${segs}</svg>`;
}
function ring(score,{size=220,stroke=18}={}){
  const r=(size-stroke)/2, c=2*Math.PI*r, len=score/100*c;
  return `<div class="ring"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#F1ECE0" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#rg)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${len.toFixed(1)} ${(c-len).toFixed(1)}"/>
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6C976"/><stop offset="1" stop-color="#C6A02E"/></linearGradient></defs></svg>
    <div class="val"><b>${score}</b><small>Cleanliness Score</small></div></div>`;
}
function heatmap(rows,cols,{cell=20,gap=5}={}){
  let s=`<svg width="${cols*(cell+gap)}" height="${rows*(cell+gap)}" viewBox="0 0 ${cols*(cell+gap)} ${rows*(cell+gap)}">`;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const v=(Math.sin(x*1.3+y*0.7)*0.5+0.5); const a=(0.12+v*0.75).toFixed(2);
    s+=`<rect x="${x*(cell+gap)}" y="${y*(cell+gap)}" width="${cell}" height="${cell}" rx="4" fill="rgba(198,160,46,${a})"/>`;
  }
  return s+'</svg>';
}
function sparkline(data,color='#C6A02E'){
  const w=120,h=40,max=Math.max(...data),min=Math.min(...data);
  const pts=data.map((v,i)=>[i/(data.length-1)*w, h-((v-min)/((max-min)||1))*(h-6)-3]);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><path d="${pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

const TIMELINE=[

function viewTrack(){

function filterTrack(q){
  q=q.toLowerCase();
  $$('#tracklist .report-item').forEach(el=>{ el.style.display = el.textContent.toLowerCase().includes(q)?'':'none'; });
}
function trackDetail(r){
  // stage index from progress
  const idx = r.progress>=100?6 : r.progress>=75?5 : r.progress>=55?3 : r.progress>=35?2 : r.progress>=18?1 : 0;
  const tl = TIMELINE.map(([t,m],i)=>`
    <div class="tl-item ${i<idx?'done':''} ${i===idx?'current':''}">

      <div class="tl-t">${t}</div><div class="tl-m">${m}</div>
      ${i<=idx?`<div class="tl-card">${i===0?`Submitted by citizen · ${r.date} 10:24 · Location captured`:
        i===1?`Verified by officer R. Menon · AI flagged no duplicate · Human confirmed`:
        i===2?`Assigned to <b>${r.team!=='—'?r.team:'Team Alpha'}</b> · Dept: ${r.dept} · Deadline in 48 hrs`:
        i===3?`Field team on site · ETA 40 min`:
        i===4?`Cleanup completed · Evidence uploaded · 05 Oct 16:10`:
        i===5?`Awaiting your confirmation`:'Case closed and archived'}</div>`:''}

    <button class="btn btn-ghost btn-sm" data-act="backtrack">← All reports</button>

        <p class="muted mt8">${esc(r.issue)} · ${inl('pin')} ${esc(r.loc)} · ${r.ward}</p></div>
      <div class="row gap10">${prioPill(r.prio)}<span class="pill neutral">${r.team!=='—'?'👷 '+r.team:'Unassigned'}</span></div>
    </div>
    <div class="grid mt24" style="grid-template-columns:1.1fr 1fr">
      <div class="card"><h3 style="font-size:19px;margin-bottom:20px">Timeline</h3><div class="timeline">${tl}</div></div>
      <div class="col gap18">
        ${r.progress>=75?`<div class="card pad-lg">
          <span class="kicker">Before / After verification</span>
          <h3 style="font-size:20px;margin:8px 0 16px">Drag to compare</h3>
          <div class="ba" data-act="ba" style="height:260px">
            <div class="layer">${beforeSVG()}</div>
            <div class="layer after-layer" id="afterlayer">${afterSVG()}</div>
            <span class="tag l">Before</span><span class="tag r">After</span>
            <div class="handle" id="bhandle"></div>
          </div>
          <div class="grid mt16" style="grid-template-columns:1fr 1fr;gap:10px;font-size:13.5px">
            <div><span class="muted">Completed</span><br><b>05 Oct 2026 · 16:10</b></div>
            <div><span class="muted">Team</span><br><b>${r.team!=='—'?r.team:'Team Alpha'}</b></div>
            <div><span class="muted">Location</span><br><b>${esc(r.loc)}</b></div>
            <div><span class="muted">Evidence</span><br><b>2 photos · verified</b></div>
          </div>
          <div class="card mt16" style="background:var(--paper-2)">
            <b>Did this actually solve the problem?</b>
            <div class="row gap10 mt16"><button class="btn btn-gold btn-sm" data-act="verifyyes" data-id="${r.id}">Yes, resolved</button>
              <button class="btn btn-ghost btn-sm" data-act="verifyno" data-id="${r.id}">No, still an issue</button></div>
          </div>
        </div>`:`<div class="card pad-lg center"><div style="color:var(--gold-deep)">${ic('clock',44,1.6)}</div><h3 class="mt8" style="font-size:20px">Verification opens after cleanup</h3><p class="muted mt8">Once the field team uploads evidence, you'll be asked to confirm the result here.</p></div>`}
        <div class="card"><h3 style="font-size:17px">Case notes</h3><p class="muted mt8" style="font-size:14px">${icon('shield')} Municipal status changes are logged with actor, action and timestamp and cannot be silently rewritten.</p></div>
      </div>
    </div>
  </div>`;
}
function verifyAction(id,yes){
  const r=state.reports.find(x=>x.id===id);
  if(yes){ if(r){r.status='resolved';r.progress=100;} toast('Thank you — case marked resolved and closed.'); }
  else { if(r){r.status='reopened';r.progress=45;} toast('Report reopened — please upload additional evidence.'); }
  render();
}

/* ---------------- ENGINE: layer, toast, router, events ---------------- */
function openLayer(html){ $('#layer').innerHTML=`<div class="overlay" data-act="closelayer-bg">${html}</div>`; }
function closeLayer(){ $('#layer').innerHTML=''; }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span class="dot"></span>${esc(msg)}`; $('#layer').appendChild(t); setTimeout(()=>t.remove(),2600); }
function notifDrawer(){

    <div class="between"><h2 style="font-size:22px">Notifications</h2><button class="icon-btn" data-act="closelayer">✕</button></div>
    <p class="hint mt8">Updates on your reports and your area.</p>
    <div class="mt24">${state.notif.map(n=>`<div class="notif"><div class="ic">${ic(n.ic,18)}</div><div><b style="font-size:14.5px">${n.t}</b><div class="hint mt8">${n.m} · ${n.time}</div></div></div>`).join('')}</div>
  </div></div>`);
}

/* router */
function route(){
  const h=(location.hash||'#/home').replace('#/','').split('/')[0]||'home';
  state.route=h; return h;
}
function viewFor(h){
  switch(h){
    case 'home': return viewHome();
    case 'signin': return viewSignin();
    case 'citizen': return state.role?viewCitizen():viewSignin();
    case 'report': return viewReport();
    case 'track': return viewTrack();
    case 'dashboard': return viewDashboard();
    case 'insights': return viewInsights();
    case 'about': return viewAbout();
    case 'officer': return state.role==='officer'||state.role==='admin'?viewOfficer():viewSignin();
    case 'worker': return state.role==='worker'?viewWorker():viewSignin();
    case 'profile': return state.role?viewProfile():viewSignin();
    default: return viewHome();
  }
}
function render(){
  const h=route();
  $('#topnav').innerHTML=navHTML();
  $('#app').innerHTML=viewFor(h);
  $('#bottomnav').innerHTML=bottomNavHTML();
  window.scrollTo({top:0,behavior:'instant'});
  animateCounters();
}
function animateCounters(){
  $$('[data-count]').forEach(el=>{
    const target=el.getAttribute('data-count'); const num=parseFloat(target.replace(/[^\d.]/g,''));
    if(isNaN(num)) return; const suffix=target.replace(/[\d.,]/g,''); const dec=(target.split('.')[1]||'').replace(/[^\d]/g,'').length;
    let cur=0; const t0=performance.now();
    const step=ts=>{ const p=Math.min((ts-t0)/1100,1); cur=num*(1-Math.pow(1-p,3)); el.textContent=cur.toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suffix; if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* events (delegated) */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.getAttribute('data-act');
  if(a==='notif'){ notifDrawer(); }
  else if(a==='pickrole'){ state.role=t.getAttribute('data-role'); $$('.role').forEach(r=>r.classList.toggle('sel',r===t)); }
  else if(a==='signin'){ doSignin(); }
  else if(a==='setloc'){ state.wizard.data.loc=t.getAttribute('data-v'); render(); }
  else if(a==='setissue'){ state.wizard.data.issue=t.getAttribute('data-v'); render(); }
  else if(a==='addphoto'){ state.wizard.data.photos=Math.min(3,(state.wizard.data.photos||0)+1); render(); }
  else if(a==='wiznext'){ state.wizard.step=Math.min(5,state.wizard.step+1); render(); }
  else if(a==='wizback'){ state.wizard.step=Math.max(1,state.wizard.step-1); render(); }
  else if(a==='submit'){ submitReport(); }
  else if(a==='tracknew'){ closeLayer(); state.selReport=t.getAttribute('data-id'); go('track'); }
  else if(a==='openreport'){ state.selReport=t.getAttribute('data-id'); go('track'); }
  else if(a==='backtrack'){ state.selReport=null; render(); }
  else if(a==='verifyyes'){ verifyAction(t.getAttribute('data-id'),true); }
  else if(a==='verifyno'){ verifyAction(t.getAttribute('data-id'),false); }
  else if(a==='otab'){ state.officerTab=t.getAttribute('data-tab'); render(); }
  else if(a==='caseopen'){ caseModal(t.getAttribute('data-id')); }
  else if(a==='pin'){ pinModal(); }
  else if(a==='toast'){ toast(t.getAttribute('data-msg')); }
  else if(a==='rolemenu'){ go('signin'); }
  else if(a==='closelayer'){ closeLayer(); }
  else if(a==='closelayer-bg'){ if(e.target===t) closeLayer(); }
});

/* before/after slider drag */
document.addEventListener('pointerdown',e=>{
  const ba=e.target.closest('.ba'); if(!ba) return; ba.setPointerCapture(e.pointerId); ba.dataset.drag='1'; moveBA(ba,e);
});
document.addEventListener('pointermove',e=>{ const ba=e.target.closest('.ba')||document.querySelector('.ba[data-drag="1"]'); if(ba&&ba.dataset.drag) moveBA(ba,e); });
document.addEventListener('pointerup',e=>{ const ba=document.querySelector('.ba[data-drag="1"]'); if(ba){ ba.dataset.drag=''; } });
function moveBA(ba,e){
  const rect=ba.getBoundingClientRect(); let x=((e.clientX-rect.left)/rect.width)*100; x=Math.max(2,Math.min(98,x));
  const al=ba.querySelector('.after-layer'); const hd=ba.querySelector('.handle');
  if(al) al.style.clipPath=`inset(0 0 0 ${x}%)`; if(hd) hd.style.left=x+'%';
}

async function doSignin(email,pw){
  if(!email || !pw) return;            // ignore arg-less calls from the legacy handler
  state.authError=null;
  try{
    const res = await api.login(email,pw);
    api.setToken(res.token); api.online=true;
    state.role=res.user.role; state.user={name:res.user.name, initials:(res.user.name||'U').slice(0,1).toUpperCase()};
    await loadAll(); toast('Signed in as '+ROLE_LABEL[state.role]);
    go(state.role==='officer'?'officer':state.role==='worker'?'worker':state.role==='admin'?'admin':'citizen');
  }catch(e){
    if(e.status){ state.authError=e.message; render(); }
    else { state.authError=null; api.online=false; toast('Backend not reachable — starting demo mode'); go('home'); }
  }
}

async function verifyAction(id,yes){
  try{
    await api.verify(id, yes?'resolved':'reopened');
    await loadAll();
    toast(yes?'Thank you — case marked resolved and closed.':'Report reopened — please upload additional evidence.');
  }catch(e){
    const r=state.reports.find(x=>x.id===id);
    if(!e.status && r){ r.status=yes?'resolved':'reopened'; r.progress=yes?100:45; toast(yes?'Marked resolved (demo).':'Reopened (demo).'); }

/* ---------------- track detail (real events + evidence) ---------------- */
function trackDetail(r){
  const idx = r.progress>=100?6 : r.progress>=75?5 : r.progress>=55?3 : r.progress>=35?2 : r.progress>=18?1 : 0;
  const evByStage = {}; (r.events||[]).forEach(e=>evByStage[e.stage]=e);
  const tl = TIMELINE.map(([t,m],i)=>{
    const ev = evByStage[t];
    return `<div class="tl-item ${i<idx?'done':''} ${i===idx?'current':''}">
      <div class="node">${i<idx?'✓':i+1}</div>
      <div class="tl-t">${t}</div><div class="tl-m">${m}</div>
      ${i<=idx?`<div class="tl-card">${ev?esc(ev.note||t):(i===0?`Submitted by citizen · ${r.date}`:'')} ${ev&&ev.created_at?`<span class="faint">· ${esc((ev.created_at||'').slice(0,16).replace('T',' '))}</span>`:''}</div>`:''}
    </div>`;
  }).join('');
  const ev = r.evidence||[];
  const before = ev.find(e=>e.kind==='before' && !String(e.filename).startsWith('seed_'));
  const after  = ev.find(e=>e.kind==='after'  && !String(e.filename).startsWith('seed_'));
  const beforeLayer = before ? `<img src="${api.uploadUrl(before.filename)}" style="width:100%;height:100%;object-fit:cover">` : beforeSVG();
  const afterLayer  = after  ? `<img src="${api.uploadUrl(after.filename)}"  style="width:100%;height:100%;object-fit:cover">` : afterSVG();
  return `<div class="wrap" style="padding-top:34px;max-width:1000px">
    <button class="btn btn-ghost btn-sm" data-act="backtrack">← All reports</button>
    <div class="between mt16" style="flex-wrap:wrap;gap:14px">
      <div><div class="row gap10" style="align-items:center"><h1 style="font-size:28px">${r.id}</h1>${statusPill(r.status)}</div>
        <p class="muted mt8">${esc(r.issue)} · ${inl('pin')} ${esc(r.loc)} · ${r.ward}</p></div>
      <div class="row gap10">${prioPill(r.prio)}<span class="pill neutral">${r.team!=='—'?r.team:'Unassigned'}</span></div>
    </div>
    <div class="grid mt24" style="grid-template-columns:1.1fr 1fr">
      <div class="card"><h3 style="font-size:19px;margin-bottom:20px">Timeline</h3><div class="timeline">${tl}</div></div>
      <div class="col gap18">
        ${r.progress>=75?`<div class="card pad-lg">
          <span class="kicker">Before / After verification</span>
          <h3 style="font-size:20px;margin:8px 0 16px">Drag to compare</h3>
          <div class="ba" data-act="ba" style="height:260px">
            <div class="layer">${beforeLayer}</div>
            <div class="layer after-layer">${afterLayer}</div>
            <span class="tag l">Before</span><span class="tag r">After</span>
            <div class="handle"></div>
          </div>
          <div class="card mt16" style="background:var(--paper-2)">
            <b>Did this actually solve the problem?</b>
            <div class="row gap10 mt16"><button class="btn btn-gold btn-sm" data-act="verifyyes" data-id="${r.id}">Yes, resolved</button>
              <button class="btn btn-ghost btn-sm" data-act="verifyno" data-id="${r.id}">No, still an issue</button></div>
          </div>
        </div>`:`<div class="card pad-lg center"><div style="color:var(--gold-deep)">${ic('clock',44,1.6)}</div><h3 class="mt8" style="font-size:20px">Verification opens after cleanup</h3><p class="muted mt8">Once the field team uploads evidence, you'll be asked to confirm the result here.</p></div>`}
        <div class="card"><h3 style="font-size:17px">Case notes</h3><p class="muted mt8" style="font-size:14px">${icon('shield')} Municipal status changes are logged with actor, action and timestamp and cannot be silently rewritten.</p></div>
      </div>
    </div>
  </div>`;
}

  const r=(state.reports||[]).find(x=>x.id===id) || {id,issue:'',loc:'',status:'review',prio:'medium',team:'—',dept:'—',date:''};
  const teamOpts=(state.teams||[]).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  openLayer(`<div class="modal" style="max-width:720px" onclick="event.stopPropagation()">
    <div class="between"><div class="row gap10"><h2 style="font-size:22px">${r.id}</h2>${statusPill(r.status)}</div><button class="icon-btn" data-act="closelayer">✕</button></div>
    <p class="muted mt8">${esc(r.issue)} · ${inl('pin')} ${esc(r.loc)}</p>
    <div class="grid mt24" style="grid-template-columns:1fr 1fr;gap:12px;font-size:14px">
      <div class="card" style="padding:14px 16px"><span class="muted">Priority</span><br>${prioPill(r.prio)}</div>
      <div class="card" style="padding:14px 16px"><span class="muted">Team</span><br><b>${r.team}</b></div>
      <div class="card" style="padding:14px 16px"><span class="muted">Department</span><br><b>${esc(r.dept)}</b></div>
      <div class="card" style="padding:14px 16px"><span class="muted">Reported</span><br><b>${r.date}</b></div>
    </div>
    <div class="field mt16"><label>Change status (logged to audit trail)</label><select id="cm_status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===r.status?'selected':''}>${v.label}</option>`).join('')}</select></div>
    <div class="field"><label>Assign team</label><select id="cm_team"><option value="">— keep current —</option>${teamOpts}</select></div>
    <div class="field"><label>Officer note</label><textarea id="cm_note" rows="2" placeholder="Recorded with your identity and timestamp."></textarea></div>
    <div class="row gap10" style="flex-wrap:wrap"><button class="btn btn-gold btn-sm" data-act="casesave" data-id="${r.id}">Save changes</button><button class="btn btn-ghost btn-sm" data-act="caseevidence" data-id="${r.id}">Upload after-photo</button><button class="btn btn-dark btn-sm" data-act="closelayer">Close</button></div>
    <p class="hint mt16">${icon('shield')} Changes create an immutable audit entry (who → what → when).</p>
  </div>`);
}
async function caseSave(id){
  const status=($('#cm_status')||{}).value, team=($('#cm_team')||{}).value, note=($('#cm_note')||{}).value;
  try{
    if(team) await api.assign(id, parseInt(team));
    if(status) await api.setStatus(id, status, note||null);
    await loadAll(); closeLayer(); toast('Saved and logged to the audit trail.'); render();
  }catch(e){ toast(e.message||'Could not save.'); }
}
async function caseEvidence(id){
  const input=document.createElement('input'); input.type='file'; input.accept='image/*';
  input.onchange=async()=>{ if(!input.files[0]) return;
    try{ await api.uploadEvidence(id,'after',input.files[0]); await loadAll(); toast('After-photo uploaded.'); }
    catch(e){ toast(e.message||'Upload failed.'); } };
  input.click();
}

/* ---------------- notifications (live) ---------------- */
async function notifDrawer(){
  let items = state.notifs;
  if(api.online){ try{ items=(await api.notifications()).notifications; state.notifs=items; }catch(e){} }
  items = items || NOTIFS.map((n,i)=>({id:i,title:n.t,body:n.m,is_read:!n.unread,created_at:n.time}));
  openLayer(`<div class="overlay" data-act="closelayer-bg" style="align-items:stretch;justify-content:flex-end;padding:0"><div class="drawer" onclick="event.stopPropagation()">
    <div class="between"><h2 style="font-size:22px">Notifications</h2><button class="icon-btn" data-act="closelayer">✕</button></div>
    <p class="hint mt8">Updates on your reports and your area.</p>
    <div class="mt24">${items.map(n=>`<div class="notif"><div class="ic">${ic(n.is_read?'check':'pin',18)}</div><div><b style="font-size:14.5px">${esc(n.title)}</b><div class="hint mt8">${esc(n.body||'')} ${n.created_at?('· '+esc(String(n.created_at).slice(0,16).replace('T',' '))):''}</div></div></div>`).join('')||'<p class="muted">No notifications yet.</p>'}</div>
  </div></div>`);
}

/* ---------------- admin ---------------- */
function viewAdmin(){
  const users = state.users||[], audit = state.auditRows||[];
  return `<div class="shell">
    <aside class="side"><div class="brand"><span class="mark">CC</span>CleanCity Tracker</div>
      <nav><a class="active">${icon('settings')}<span>Administration</span></a></nav>
      <div class="side-foot">Signed in as <b style="color:#fff">Administrator</b><br>Role &amp; audit management</div></aside>
    <main class="main">
      <div class="page-head"><div><h1>Administration</h1><p>Users, roles and the immutable audit trail.</p></div><span class="pill green">● Live</span></div>
      <div class="card"><h3 style="font-size:18px">Users &amp; roles</h3>
        <div class="tablewrap mt16"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Ward</th><th>Change role</th></tr></thead><tbody>
        ${users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td><span class="pill gold">${u.role}</span></td><td>${esc(u.ward||'—')}</td>
          <td><select data-act="setrole" data-id="${u.id}">${['citizen','worker','officer','admin'].map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${r}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>
      <div class="card mt24"><h3 style="font-size:18px">Audit trail <span class="faint" style="font-size:13px;font-weight:400">· who → what → when</span></h3>
        <div class="tablewrap mt16"><table><thead><tr><th>When</th><th>Actor</th><th>Role</th><th>Action</th><th>Entity</th><th>Change</th></tr></thead><tbody>
        ${audit.slice(0,40).map(a=>`<tr><td>${esc(String(a.created_at||'').slice(0,16).replace('T',' '))}</td><td>${esc(a.actor||'—')}</td><td>${esc(a.actor_role||'')}</td><td><b>${esc(a.action)}</b></td><td>${esc(a.entity)} ${esc(a.entity_id||'')}</td><td class="muted">${esc((a.prev_state||'')+' → '+(a.new_state||''))}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No entries</td></tr>'}</tbody></table></div></div>
    </main>
  </div>`;
}

/* ---------------- router override (adds admin) ---------------- */
function viewFor(h){
  switch(h){
    case 'home': return viewHome();
    case 'signin': return state.showRegister?viewRegister():viewSignin();
    case 'citizen': return state.role?viewCitizen():viewSignin();
    case 'report': return viewReport();
    case 'track': return viewTrack();
    case 'dashboard': return viewDashboard();
    case 'insights': return viewInsights();
    case 'about': return viewAbout();
    case 'officer': return (state.role==='officer'||state.role==='admin')?viewOfficer():viewSignin();
    case 'worker': return state.role==='worker'?viewWorker():viewSignin();
    case 'admin': return state.role==='admin'?viewAdmin():viewSignin();
    case 'profile': return state.role?viewProfile():viewSignin();
    default: return viewHome();
  }
}

/* ---------------- extra event handlers ---------------- */
document.addEventListener('click', async (e)=>{
  const t=e.target.closest('[data-act]'); if(!t) return; const a=t.getAttribute('data-act');
  if(a==='signin'){ const em=($('#li_email')||{}).value, pw=($('#li_pw')||{}).value; doSignin(em,pw); }
  else if(a==='register'){ doRegister(); }
  else if(a==='showregister'){ state.showRegister=true; state.authError=null; render(); }
  else if(a==='showsignin'){ state.showRegister=false; state.authError=null; render(); }
  else if(a==='demo'){ state.role=t.getAttribute('data-role'); api.online=false; state.user={name:'Demo User',initials:'D'}; go(state.role==='officer'?'officer':state.role==='worker'?'worker':state.role==='admin'?'admin':'citizen'); }
  else if(a==='signout'){ signout(); }
  else if(a==='casesave'){ caseSave(t.getAttribute('data-id')); }
  else if(a==='caseevidence'){ caseEvidence(t.getAttribute('data-id')); }
  else if(a==='setrole'){ /* handled on change */ }
});
document.addEventListener('change', async (e)=>{
  const t=e.target.closest('[data-act="setrole"]'); if(!t) return;
  try{ await api.setRole(parseInt(t.getAttribute('data-id')), t.value); state.users=(await api.users()).users; state.auditRows=(await api.audit()).audit; toast('Role updated and logged.'); render(); }
  catch(err){ toast(err.message||'Could not change role.'); }
});

/* ---------------- bootstrap: resume session ---------------- */
(async function bootstrap(){
  if(api.token){
    try{ const me=await api.me(); api.online=true; state.role=me.user.role; state.user={name:me.user.name,initials:(me.user.name||'U').slice(0,1).toUpperCase()}; await loadAll(); render(); return; }
    catch(e){ api.setToken(null); }
  }
  // probe backend so the UI can show Live vs Demo
  try{ await fetch(API_BASE+'/api/health'); api.online=true; try{ state.city = await api.cityStats(); }catch(e){} }catch(e){ api.online=false; }
  render();
})();

</script>
</body>
</html>
